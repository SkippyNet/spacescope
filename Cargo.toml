[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["SkippyNet"]
rust-version = "1.87"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
