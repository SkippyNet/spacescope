name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            name: windows-x86
            target: i686-pc-windows-msvc
          # Built on the oldest supported release so the binary also runs on
          # Ubuntu 22.04+ and Debian 12+.
          - os: ubuntu-22.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A release tag must name the version the binaries report.
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --release --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Binary reports the right version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          out=$(./target/${{ matrix.target }}/release/sscan --version)
          echo "$out"
          [ "$out" = "sscan $version" ]

      # --- Windows code signing (SignPath Foundation) ------------------------
      # Runs for release tags once the repository has been given its SignPath
      # organisation id (Actions variable) and API token (Actions secret).
      # Until then releases are built exactly the same way, unsigned.
      - name: Upload unsigned binaries for signing
        id: unsigned
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/spacescope.exe
            target/${{ matrix.target }}/release/sscan.exe
          if-no-files-found: error
      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'spacescope' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-binaries' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package (Windows, signed)
        if: runner.os == 'Windows' && steps.unsigned.outcome == 'success'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Name ${{ matrix.name }} -ExeDir signed
      - name: Package (Windows)
        if: runner.os == 'Windows' && steps.unsigned.outcome != 'success'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Name ${{ matrix.name }} -ExeDir target/${{ matrix.target }}/release
      - name: Package (Debian)
        if: runner.os == 'Linux'
        run: ./scripts/package-deb.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: spacescope-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: spacescope-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " v { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.deb \
            --title "SpaceScope ${GITHUB_REF_NAME#v}" \
            --notes "${notes:-See CHANGELOG.md}"
