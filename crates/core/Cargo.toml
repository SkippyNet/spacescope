[package]
name = "spacescope-core"
description = "Fast parallel disk scanner, size tree and treemap layout"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "spacescope_core"

[[bin]]
name = "sscan"
path = "src/bin/sscan.rs"

[dependencies]
parking_lot = "0.12"
crossbeam-deque = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
